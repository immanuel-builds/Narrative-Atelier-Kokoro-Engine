{% extends "base.html" %}

{% block title %}Register - Kokoro Engine{% endblock %}

{% block content %}
<div class="py-24 fade-in">
    <div class="container" style="max-width: 400px;">
        <div class="card">
            <h2 class="serif text-center mb-8" style="font-size: 2rem;">Register</h2>

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form action="/auth/register" method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="flex items-center justify-between" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                </div>
            </form>

            <div class="text-center mt-8">
                <p style="font-size: 0.875rem; color: var(--text-muted);">
                    Already registered? <a href="/auth/login" style="color: var(--indigo-muted);">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
